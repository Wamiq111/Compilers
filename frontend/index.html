<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Compiler with VS Code Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="theme-dark">
    <div class="app-container">
        <!-- Header / Toolbar -->
        <header class="app-header">
            <div class="logo">Compiler<span class="highlight">IDE</span></div>

            <div class="editor-tabs" id="editor-tabs">
                <!-- Dynamic tabs will go here, hardcoded for now -->
            </div>

            <div class="header-actions">
                <select id="lang-selector" class="lang-selector" title="Select Project Type"
                    style="margin-right: 15px; padding: 5px; border-radius: 4px; background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-color);">
                    <option value="web">Web (HTML/CSS/JS)</option>
                    <option value="python">Python</option>
                </select>
                <button id="btn-format" class="btn" title="Format Code">Format</button>
                <button id="btn-run" class="btn btn-primary" title="Run Code">Run</button>
                <button id="btn-stop" class="btn btn-danger" disabled title="Stop Execution">Stop</button>
                <button id="btn-clear" class="btn" title="Clear Editor">Clear</button>
                <button id="btn-copy" class="btn" title="Copy Code">Copy</button>
                <button id="btn-download" class="btn" title="Download Code">Download</button>
                <div class="theme-toggle">
                    <label class="switch" title="Toggle Theme">
                        <input type="checkbox" id="theme-switch" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-workspace">
            <!-- Activity Bar (VS Code style) -->
            <div class="activity-bar">
                <button class="activity-action active" id="act-explorer" title="Explorer">📂</button>
                <button class="activity-action" id="act-search" title="Search">🔍</button>
            </div>

            <!-- Sidebar (File Explorer / Search Panes) -->
            <aside class="sidebar-pane" id="sidebar-pane">
                <!-- Explorer View -->
                <div class="sidebar-view" id="view-explorer">
                    <div class="sidebar-header">
                        <span class="sidebar-title">Explorer</span>
                        <div class="sidebar-actions">
                            <button id="btn-new-file" title="New File" class="icon-btn">📄</button>
                            <button id="btn-new-folder" title="New Folder" class="icon-btn">📁</button>
                        </div>
                    </div>
                    <div class="sidebar-content">
                        <div id="file-tree" class="file-tree"></div>
                    </div>
                </div>

                <!-- Search View -->
                <div class="sidebar-view hidden" id="view-search">
                    <div class="sidebar-header">
                        <span class="sidebar-title">Search</span>
                    </div>
                    <div class="sidebar-content">
                        <div class="search-box">
                            <input type="text" id="file-search-input" placeholder="Search across files...">
                        </div>
                        <div id="search-results" class="file-tree"></div>
                    </div>
                </div>
            </aside>

            <div class="resizer resizer-h" id="resizer-sidebar"></div>

            <!-- Left Pane: Editor -->
            <section class="pane editor-pane" id="editor-pane">
                <div id="monaco-container" class="monaco-container">
                    <div class="editor-loader">Loading Editor...</div>
                </div>
            </section>

            <!-- Resizer -->
            <div class="resizer resizer-h" id="resizer-main"></div>

            <!-- Right Pane: Preview + Console -->
            <section class="pane right-pane" id="right-pane">
                <div class="preview-toolbar">
                    <span class="preview-title">Live Preview</span>
                    <div class="preview-controls">
                        <button id="btn-refresh-preview" class="btn btn-small">Refresh</button>
                        <label class="checkbox-label" title="Run preview on change (debounced)">
                            <input type="checkbox" id="live-preview-toggle" checked> Auto Run
                        </label>
                    </div>
                </div>

                <div class="preview-container" id="preview-container">
                    <!-- Iframe injected via JS -->
                </div>

                <!-- Resizer for Console -->
                <div class="resizer resizer-v" id="resizer-console"></div>

                <div class="console-pane" id="console-pane">
                    <div class="console-header">
                        <span class="console-title">Console / Problems</span>
                        <button id="btn-clear-console" class="btn btn-small">Clear</button>
                    </div>
                    <div class="console-output" id="console-output"></div>
                </div>
            </section>
        </main>

        <!-- Status Bar / Footer -->
        <footer class="app-footer">
            <div class="footer-left">
                <span>CompilerIDE Local Workspace</span>
            </div>
            <div class="footer-right">
                <a href="about.html" target="_blank">About Us</a>
                <a href="contact.html" target="_blank">Contact Us</a>
                <a href="privacy.html" target="_blank">Privacy Policy</a>
                <a href="terms.html" target="_blank">Terms & Conditions</a>
                <a href="advertise.html" target="_blank">Advertise</a>
            </div>
        </footer>
    </div>

    <!-- Main App -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
