<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Compiler IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-base);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color var(--transition-fast);
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: var(--text-highlight);
        }

        .contact-form button {
            padding: 15px 30px;
            background: linear-gradient(90deg, var(--btn-primary-bg), #6366f1);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            align-self: flex-start;
            transition: opacity var(--transition-fast);
        }

        .contact-form button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body class="theme-dark page-static">
    <nav class="page-nav">
        <a href="index.html" class="logo menu-link">Compiler<span class="highlight">IDE</span></a>
        <div class="page-nav-links">
            <a href="about.html" class="menu-link">About Us</a>
            <a href="contact.html" class="menu-link active">Contact Us</a>
            <a href="privacy.html" class="menu-link">Privacy</a>
            <a href="terms.html" class="menu-link">Terms</a>
            <a href="advertise.html" class="menu-link">Advertise</a>
            <a href="index.html" class="btn-editor menu-link">Open Editor</a>
        </div>
    </nav>
    <div class="page-container">
        <h1>Get In <span class="gradient">Touch</span></h1>
        <p>Have questions, amazing feedback, or found a bug? We would love to hear from our community members and users.
            Fill out the form below and our team will get back to you shortly.</p>

        <form class="contact-form"
            onsubmit="event.preventDefault(); alert('Message sent successfully! (This is a frontend demo)'); window.location.href='index.html';">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email address" required>
            <textarea rows="8" placeholder="How can we help you?" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>

</html>
